[package]
name = "bosun-app"
edition.workspace = true
version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "bosun"
path = "src/main.rs"

[dependencies]
bosun-core = { path = "../bosun-core" }
bosun-ui = { path = "../bosun-ui" }
windows-numerics = "0.3"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
