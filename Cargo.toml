[workspace]
resolver = "3"
members = ["crates/bosun-core", "crates/bosun-ui", "crates/bosun-tray", "crates/bosun-app", "crates/bosun-setup"]

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "MIT"

[workspace.dependencies]
windows = "0.62"

# Small, fast binaries: memory and size are a product feature.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
