<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="256" height="256">
<defs>
 <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset=".45" stop-color="#0a1724"/><stop offset=".8" stop-color="#0c4f8c"/><stop offset="1" stop-color="#2a9bf0"/></linearGradient>
 <radialGradient id="bottomglow" cx=".5" cy="1.05" r=".75"><stop offset="0" stop-color="#7cc8ff" stop-opacity=".9"/><stop offset=".45" stop-color="#1a86e0" stop-opacity=".45"/><stop offset="1" stop-color="#1a86e0" stop-opacity="0"/></radialGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".25" stop-color="#fff" stop-opacity=".08"/><stop offset=".75" stop-color="#9fd6ff" stop-opacity=".15"/><stop offset="1" stop-color="#d8eeff" stop-opacity=".9"/></linearGradient>
 <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset=".7" stop-color="#050608"/><stop offset="1" stop-color="#0a1420"/></radialGradient>
 <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f4f9ff"/><stop offset="1" stop-color="#d6ecff"/></linearGradient>
 <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
 <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
 <clipPath id="tc"><rect width="260" height="260" rx="64"/></clipPath>
