  <path d="M110 178V82h34a23 23 0 0 1 0 46h-34h40a25 25 0 0 1 0 50z" fill="none" stroke="#bfe3ff" stroke-width="28" stroke-linejoin="round" opacity=".35" filter="url(#blur6)"/>
  <path d="M110 178V82h34a23 23 0 0 1 0 46h-34h40a25 25 0 0 1 0 50z" fill="none" stroke="url(#glyph)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
 </g>
